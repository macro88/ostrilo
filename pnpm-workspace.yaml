# Install scripts run on the machine that runs `pnpm install`, so each one is
# reviewed here rather than allowed by default.
#
# spawn-sync is denied. It comes from wxt > web-ext-run > fx-runner, and its
# postinstall adds a dependency to its own package.json and runs `npm install`
# inside node_modules - outside this lockfile, minimumReleaseAge and
# trustPolicy - but only on Node releases without child_process.spawnSync
# (before 0.12). On any Node this project supports it does nothing, so denying
# it costs nothing.
allowBuilds:
  esbuild: true
  sharp: true
  spawn-sync: false
minimumReleaseAge: 1440
overrides:
  "@wxt-dev/module-react>@vitejs/plugin-react": "5.0.4"
  # --- Provenance overrides. Do NOT relax trustPolicy or minimumReleaseAge
  # --- to work around a rejection; replace the untrusted edge instead.
  #
  # semver@6.3.1 carries no provenance attestation while earlier 6.x releases
  # did, so trustPolicy: no-downgrade correctly refuses it. Three packages pull
  # it: @babel/core, @babel/helper-compilation-targets and
  # @babel/helper-create-class-features-plugin, so the override is global
  # rather than scoped to one of them. 7.8.5 is provenance-attested, is already
  # in this tree via other dependents, and is API-compatible with the helpers
  # Babel uses (valid / satisfies / gte / lt / coerce).
  semver: "7.8.5"
  #
  # @webext-core/isolated-element@1.1.5 likewise lost provenance relative to
  # earlier releases. It is an internal wxt dependency (wxt declares ^1.1.3)
  # that backs createShadowRootUi, which this project never calls - it is not
  # referenced anywhere under src/. 2.0.1 is the smallest provenance-attested
  # version available.
  "@webext-core/isolated-element": "2.0.1"
  #
  # --- Advisory overrides. All of these sit in the wxt build toolchain
  # --- (web-ext-run / fx-runner / firefox-profile) and none ships in the
  # --- extension bundle, but the audit gate blocks on high severity and a
  # --- build machine is a valuable target in its own right.
  #
  # shell-quote was previously pinned to 1.8.4, which is itself the vulnerable
  # version: GHSA-395f-4hp3-45gv (quadratic-complexity DoS in parse()) covers
  # <=1.8.4 and is patched in >=1.8.5. No 1.8.5 was ever published, so this
  # moved to 1.10.0. GHSA-pqg4-j6r4-53mv (critical, command injection through
  # a line terminator after a comment token in quote()) then covered
  # >=1.8.4 <1.11.0, so it moves again. fx-runner pins 1.7.3 exactly and has
  # done so through every one of these; the override is what keeps it current.
  shell-quote: "1.11.0"
  # adm-zip <0.6.0: crafted ZIP triggers a 4GB allocation. 0.6.1 also clears
  # the symlink-traversal advisory (>=0.5.9 <=0.6.0).
  adm-zip: "0.6.1"
  tmp: "0.2.7"
  uuid: "11.1.1"
  #
  # --- Audit overrides, 2026-10-06, before the first public release. All three
  # --- sit in dev tooling and none ships in the extension bundle, but the
  # --- audit gate blocks on high severity, and a build machine holding signing
  # --- keys is a target in its own right.
  #
  # brace-expansion: GHSA-6j4f-fj2g-mc7p and GHSA-qhr7-859c-m2p7, uncontrolled
  # recursion and quadratic expansion. Two majors are in the tree under
  # minimatch, reached through wxt > web-ext-run and typescript-eslint. Each is
  # moved within its own major: a single override would push the CommonJS 1.x
  # consumers onto the ESM-only 5.x line.
  "brace-expansion@1": "1.1.21"
  "brace-expansion@5": "5.0.12"
  # source-map-js <1.2.2: GHSA-68fv-2mgg-jv7q, event-loop DoS through indexed
  # source-map section offsets. Reached through @tailwindcss/vite and postcss.
  source-map-js: "1.2.2"
  # proxy-addr <2.0.8: GHSA-jqcg-44mw-7w3h, IP spoofing via IPv4-mapped IPv6
  # trust subnets. Reached through aislop > @modelcontextprotocol/sdk > express.
  # Nothing here runs an HTTP server behind a proxy.
  proxy-addr: "2.0.8"
  #
  # --- Audit overrides, 2026-10-07. Three advisories reached npm's feed in
  # --- the day after the block above was written. Each bump is inside the
  # --- range its consumer declares, so nothing here forces a package onto a
  # --- line it has not been tested against.
  #
  # @modelcontextprotocol/sdk <1.31.0: GHSA-6qxp-vccf-f47h, OAuth client could
  # send credentials to an authorization server chosen by the MCP server.
  # Reached through aislop (^1.30.0), whose MCP mode is not used here, but the
  # gate blocks on high regardless. Moved again on 2026-11-03, see the block
  # below.
  # sharp <0.35.5: GHSA-wq5f-xc86-pv6w, a vulnerability in its bundled librsvg.
  # Reached through @wxt-dev/auto-icons (^0.35.3), which rasterises the
  # extension icons at build time - this one does touch a shipped asset, so it
  # is fixed on that ground as well as the gate's.
  sharp: "0.35.5"
  # Moderate advisories, below the gate's threshold but fixed because a patched
  # release exists and the bump is in range. All three sit under the MCP SDK or
  # aislop and never ship.
  # fast-uri <3.1.8: GHSA-hrr3-gc8f-f4qj, inconsistent host case normalisation.
  fast-uri: "3.1.8"
  # ip-address <=10.7.0: GHSA-j6r3-76f7-8jcv and GHSA-h3mg-xc3c-68pw, subnet
  # checks that compare addresses of different families.
  ip-address: "10.7.1"
  # smol-toml <=1.8.0: GHSA-r4xh-jqrq-34v2, quadratic-time parse().
  smol-toml: "1.9.0"
  #
  # --- Audit overrides, 2026-11-03. Eighteen high advisories reached npm's
  # --- feed after the 2026-10-07 round. All of them sit in dev tooling and none
  # --- ships in the extension bundle; the one production dependency affected,
  # --- zod, was upgraded directly in package.json rather than overridden. Each
  # --- bump is the lowest patched release, at least 24 hours old, and inside
  # --- the range its consumer declares.
  #
  # @modelcontextprotocol/sdk <1.32.0: GHSA-22jm-h49p-29qw and
  # GHSA-46jr-4wx8-v453. Same chain as the 2026-10-07 entry (aislop); the
  # override moves from 1.31.0 to 1.32.0.
  "@modelcontextprotocol/sdk": "1.32.0"
  # body-parser >=2.0.0 <2.4.0: GHSA-27r3-jxmh-p828. Reached through aislop >
  # MCP SDK > express (^2.2.x). Nothing here runs an HTTP server.
  body-parser: "2.4.0"
  # node-forge <=1.4.0: GHSA-7wch-p9px-956x, GHSA-jc66-7q78-782g,
  # GHSA-8hrf-8g6f-7xwp, GHSA-hqq3-7jhf-c5jx, GHSA-5x38-2vff-x55p, and the
  # previously ignored GHSA-86w9-cpqp-85rv. Reached through wxt > web-ext-run >
  # @devicefarmer/adbkit, the Android debugging path nothing here invokes. 1.4.1
  # is the first patched release, so the ignore entry for GHSA-86w9-cpqp-85rv is
  # removed along with its row in docs/ci-verification.md.
  node-forge: "1.4.1"
  # undici >=7.0.0 <7.30.1: GHSA-xjj6-f33q-929c, GHSA-4w7w-5xrc-9h26,
  # GHSA-2m5v-pch6-74hx and GHSA-qrxm-fqhp-jwvm. Reached through jsdom (vitest
  # test environment). Stays on the 7.x line it declares.
  undici: "7.30.1"
  # vite GHSA-587h-7wmj-h5pm (7.x <=7.3.6, 8.x 8.3.0 to 8.3.2). Two majors are
  # in the tree: 7.x is the direct devDependency and @tailwindcss/vite's peer,
  # 8.x comes from wxt > vite-node. Each is moved within its own major rather
  # than forcing one onto the other.
  "vite@7": "7.3.7"
  # zod <4.6.6: GHSA-mrhx-c7xc-m3w5, memory exhaustion validating a large
  # array. The direct dependency in package.json moved to ^4.6.6 and is not
  # governed by this entry. This pins the 4.x copies that dev tooling pulls in
  # (wxt > publish-browser-extension, aislop, knip, react-doctor's eslint
  # plugin, the MCP SDK) onto the same release.
  "zod@4": "4.6.7"
  "vite@8": "8.3.3"
  #
  # Not overridden: esbuild GHSA-g7r4-m6w7-qqqr (low, dev-server file read on
  # Windows). The fix is 0.28.x; wxt declares ^0.27.1 and esbuild treats minor
  # versions as breaking. Accepted in docs/ci-verification.md instead.
trustPolicy: no-downgrade
# Advisories with no patched release on npm. Each one is recorded, with the
# reason it is accepted, in the "Accepted exceptions" table in
# docs/ci-verification.md; an entry here without a row there is a change to the
# gate with no record. Remove the entry the day a patched version exists.
auditConfig:
  ignoreGhsas:
    # braces <=3.0.3: stack exhaustion on deeply nested patterns. Dev-only,
    # through aislop > micromatch. No 3.0.4 has been published.
    - GHSA-vfj7-8cjw-p6xm
