allowBuilds:
  esbuild: true
  msw: true
  sharp: true
  spawn-sync: true
minimumReleaseAge: 1440
overrides:
  "@wxt-dev/module-react>@vitejs/plugin-react": "5.0.4"
  # --- Provenance overrides. Do NOT relax trustPolicy or minimumReleaseAge
  # --- to work around a rejection; replace the untrusted edge instead.
  #
  # semver@6.3.1 carries no provenance attestation while earlier 6.x releases
  # did, so trustPolicy: no-downgrade correctly refuses it. Three packages pull
  # it: @babel/core, @babel/helper-compilation-targets and
  # @babel/helper-create-class-features-plugin, so the override is global
  # rather than scoped to one of them. 7.8.5 is provenance-attested, is already
  # in this tree via other dependents, and is API-compatible with the helpers
  # Babel uses (valid / satisfies / gte / lt / coerce).
  semver: "7.8.5"
  #
  # @webext-core/isolated-element@1.1.5 likewise lost provenance relative to
  # earlier releases. It is an internal wxt dependency (wxt declares ^1.1.3)
  # that backs createShadowRootUi, which this project never calls - it is not
  # referenced anywhere under src/. 2.0.1 is the smallest provenance-attested
  # version available.
  "@webext-core/isolated-element": "2.0.1"
  #
  # --- Advisory overrides. All of these sit in the wxt build toolchain
  # --- (web-ext-run / fx-runner / firefox-profile) and none ships in the
  # --- extension bundle, but the audit gate blocks on high severity and a
  # --- build machine is a valuable target in its own right.
  #
  # shell-quote was previously pinned to 1.8.4, which is itself the vulnerable
  # version: GHSA-395f-4hp3-45gv (quadratic-complexity DoS in parse()) covers
  # <=1.8.4 and is patched in >=1.8.5. No 1.8.5 was ever published, so this
  # moves to the current 1.x line.
  shell-quote: "1.10.0"
  # adm-zip <0.6.0: crafted ZIP triggers a 4GB allocation. 0.6.1 also clears
  # the symlink-traversal advisory (>=0.5.9 <=0.6.0).
  adm-zip: "0.6.1"
  tmp: "0.2.7"
  uuid: "11.1.1"
trustPolicy: no-downgrade
