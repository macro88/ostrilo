[extend]
useDefault = true

[[rules]]
  id = "generic-api-key"
  [rules.allowlist]
    paths = [
      '''tests/vectors/.*''',          # published BIP-340 and cross-implementation NIP-01 vectors
      '''pnpm-lock\.yaml''',           # integrity hashes
    ]
    # Vault passwords used as test fixtures, allowlisted by exact value rather
    # than by path, so a real-looking secret added under tests/ still fails.
    # Within one allowlist, paths and regexes are alternatives (OR).
    regexes = [
      '''^Violet-Harbor-Quill-8472-otter$''',
      '''^correct-horse-battery-staple-42$''',
      '''^Umbral-Pinecone-Drizzle-47$''',
      '''^encryption-test-456$''',
      '''^signature-test-789$''',
      # Vault key IDs in the per-key consent tests. Key IDs are random UUIDs
      # (crypto.randomUUID) and identify a record; they grant nothing.
      '''^0b6d6f5e-7a4c-4a52-8d3c-2f1e9a7c4b10$''',
      '''^7c1d3a90-5b2e-4f08-9a63-1d8e4c2b6f77$''',
    ]
