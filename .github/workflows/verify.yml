# Verification gate: typecheck, lint, the unit/integration/security suites, both
# extension builds, a dependency audit, and a secret scan of the commits each
# push or pull request introduces.
#
# E2E is deliberately NOT here. The Playwright suite builds the extension,
# starts a fixture server and drives a persistent Chromium extension context
# with workers: 1 and retries: 2. A flaky required check teaches contributors
# to re-run until green, which recreates false assurance in a new place. E2E
# runs on its own schedule in e2e.yml.
#
# These jobs are intended to become required status checks on the default
# branch. See docs/ci-verification.md for the branch-protection configuration.

name: Verify

on:
  pull_request:
  push:
    branches: [main]

# A workflow with write access is itself an attack surface in a wallet-class
# repository. Nothing here needs to write.
permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Honors the `packageManager` field in package.json rather than
      # installing an arbitrary pnpm version.
      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: pnpm

      # --frozen-lockfile also runs the supply-chain policy check declared in
      # pnpm-workspace.yaml (minimumReleaseAge, trustPolicy: no-downgrade).
      # A lockfile carrying a trust-downgraded package fails the build here.
      - run: pnpm install --frozen-lockfile

      - run: pnpm run compile

      # One rule: cryptographic libraries stay in src/infrastructure/crypto/.
      # Not a style-lint gate. Its companion - exactly one implementation per
      # primitive - is a Vitest case, because lint cannot see a second adapter
      # added inside the directory where the import is legitimate.
      - run: pnpm run lint

      # One Vitest invocation collects tests/unit, tests/integration and
      # tests/security; vitest.config.ts excludes only tests/e2e. That
      # includes tests/security/crypto-single-implementation.test.ts.
      - run: pnpm run test

  build:
    name: Extension builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run build:firefox

      # The manifest and key-handling-bundle assertions need BUILT output,
      # which the verify job does not produce. Without this step they never
      # run at all: verify runs tests without building, build builds without
      # running them.
      #
      # OSTRILO_REQUIRE_BUILD_OUTPUT turns "nothing was built" from a skip into
      # a failure. This is the one job that has just built both targets, so
      # here an absent `.output/` means the build silently produced nothing,
      # and that must not pass quietly. See tests/security/build-output.ts.
      - run: pnpm exec vitest run tests/security/manifest-assertions.test.ts tests/security/key-handling-bundle.test.ts
        env:
          OSTRILO_REQUIRE_BUILD_OUTPUT: "1"

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Threshold: fail on high and critical. Rationale and any accepted
      # exceptions are recorded in docs/ci-verification.md. Moderate and below
      # are reported but do not block, because a signer's dependency tree
      # includes build tooling whose moderate advisories rarely reach the
      # shipped extension.
      - run: pnpm audit --audit-level high

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # On push and pull_request the action scans `<base>^..<head>`, not the
          # whole history. Full depth is what lets git resolve that ancestor
          # range at all - a shallow clone has no merge base, and the scan would
          # silently cover the wrong commits.
          fetch-depth: 0
      # gitleaks-action v2 requires a paid GITLEAKS_LICENSE for repositories
      # owned by an ORGANIZATION account; personal accounts need none.
      # macro88/ostrilo is personal, so no license is required today - revisit
      # this if the repository is ever transferred to an organization.
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_ENABLE_COMMENTS defaults to true, which makes the action
          # post a PR comment on a finding - that needs `pull-requests: write`,
          # which this workflow deliberately does not grant. Disabled so the
          # gate stays read-only; a finding still fails the job and is readable
          # in the run log.
          GITLEAKS_ENABLE_COMMENTS: "false"
